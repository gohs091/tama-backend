# 모든 Java 앱이 같이 쓰는 MySQL / Redis. 외부(호스트 포트)로는 열지 않는다.
name: infra
services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      - --innodb-buffer-pool-size=256M
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [backend]
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7.0
    container_name: redis
    restart: always
    # 포인트 중복 방지/호출 한도 카운터를 저장하므로 디스크에도 남기고, 메모리가 차도 키를 지우지 않는다
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "100mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks: [backend]
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  mysql-data:
  redis-data:

networks:
  backend:
    external: true
