name: Deploy

# main 에 푸시하면: 테스트 -> Docker 이미지 빌드/푸시(GHCR) -> 서버에서 새 이미지로 교체
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 17 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # TamagochiApplicationTests 는 실제 MySQL/Redis 가 필요해서 CI 에서는 제외 (나머지 단위 테스트는 모두 실행)
      - name: 단위 테스트
        run: |
          chmod +x gradlew
          ./gradlew test \
            --tests 'com.tamagochi.tamagochi.domain.*' \
            --tests 'com.tamagochi.tamagochi.service.*' \
            --tests 'com.tamagochi.tamagochi.controller.*'

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드/푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: 서버 배포
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/servers/apps/tamagochi
            docker compose pull
            docker compose up -d
            docker image prune -f
            docker compose ps
