name: CI

on:
  pull_request:
  push:
    branches-ignore: [ main ]   # main push는 deploy.yml이 테스트 후 배포한다

# 같은 브랜치에 새 커밋이 올라오면 이전 실행을 취소한다
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 17 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      # 테스트는 메모리 H2(test 프로필)로 돌아서 DB·Redis·API 키가 필요 없다
      - name: 테스트
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests
          if-no-files-found: ignore
          retention-days: 7
