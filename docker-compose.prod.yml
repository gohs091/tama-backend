services:
  app:
    build: .
    container_name: tama-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_USERNAME: tamagotchi
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STABILITY_API_KEY: ${STABILITY_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      IAP_KEYSTORE_PATH: /certs/iap-client.p12
      IAP_KEYSTORE_PASSWORD: ${IAP_KEYSTORE_PASSWORD}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
      PROMOTION_MODE: ${PROMOTION_MODE:-off}
      PROMOTION_CODE: ${PROMOTION_CODE:-}
      EVOLUTION_PROMOTION_MODE: ${EVOLUTION_PROMOTION_MODE:-off}
      EVOLUTION_PROMOTION_CODE: ${EVOLUTION_PROMOTION_CODE:-}
      ADMIN_KEY: ${ADMIN_KEY:-}
      S3_ENABLED: ${S3_ENABLED:-false}                     # 끄적이 그림을 S3에 저장 (EC2 역할 권한 필요)
      S3_MIGRATE_EXISTING: ${S3_MIGRATE_EXISTING:-false}   # 켜면 DB에 남은 base64 그림을 S3로 옮긴다 (끝나면 다시 false)
      IMAGE_INK_STYLE: ${IMAGE_INK_STYLE:-v6}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      PUSH_CODES: ${PUSH_CODES:-}                      # 다시 만든 캠페인의 발송 코드 (예: hungry=doodle-app-hungry2)
      PUSH_AGREEMENT_CODE: ${PUSH_AGREEMENT_CODE:-doodle-app-hungry}   # 알림 동의 창에 쓸 캠페인 코드             # 끄적이 알림. 콘솔 템플릿 검수가 끝나면 GitHub 변수 PUSH_ENABLED=true             # 잉크 진화 방식: v6(v5 + 스케치도 후보를 골라 새로 그린다). 되돌리려면 GitHub 변수 IMAGE_INK_STYLE=v5 (스케치만 예전 방식), v0(전부 예전 방식)
    volumes:
      - ./certs/iap-client.p12:/certs/iap-client.p12:ro   # 토스 IAP mTLS 인증서 (서버에만 두고 저장소/이미지에 넣지 않는다)
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: tama-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: tamagotchi
      MYSQL_USER: tamagotchi
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0
    container_name: tama-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
