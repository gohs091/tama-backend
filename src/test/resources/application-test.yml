# 앱 전체가 실제로 뜨는지(빈 연결, 엔티티 매핑) 확인하는 테스트용 설정. DB는 메모리 H2를 쓴다.
spring:
  datasource:
    url: jdbc:h2:mem:tamagotchi;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
tamagotchi:
  auth:
    enabled: true
# 테스트는 시계를 옮겨 가며 원정 만료를 직접 부른다. 뒤에서 도는 스케줄러가 먼저 접어 버리지 않게 첫 실행을 멀리 미룬다
tower:
  expedition:
    sweep-initial-delay-ms: 86400000
