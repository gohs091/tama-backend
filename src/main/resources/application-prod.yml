spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/tamagotchi?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

tamagotchi:
  vitals:
    satiety-minutes-per-point: 4    # 포만감 1 감소에 걸리는 분 (4분 → 약 6.7시간에 100→0)
    strength-minutes-per-point: 8   # 파워 1 감소에 걸리는 분 (8분 → 약 13시간에 100→0)
    death-after-empty-hours: 6      # 포만감/파워가 0인 채 이 시간이 지나면 사망
    poop-interval-minutes: 60       # 똥이 1개 늘어나는 간격
    max-poop: 13                    # 이 개수 이상이면 사망
    max-tick-gap-minutes: 5         # 틱 간격이 이보다 길면 서버 중단으로 보고 그 시간은 반영하지 않음
  auth:
    enabled: true                   # 운영은 로그인 토큰 필수
    token-secret: ${AUTH_TOKEN_SECRET:}   # 비우면 서버가 켜질 때마다 임시 키를 만든다 (재시작 시 앱이 자동 재로그인)
    token-ttl-seconds: 43200        # 토큰 유효 시간(12시간)
  promotion:
    mode: ${PROMOTION_MODE:off}     # off(기본) / record / grant. 콘솔에서 프로모션 승인과 지급 테스트를 마치기 전까지 off (켜 두면 화면이 "지급돼요"라고 안내하는데 지급되지 않는다)
    code: ${PROMOTION_CODE:}             # 콘솔에서 만든 프로모션 코드. 테스트는 앞에 TEST_ 가 붙은 코드(지급·차감 없이 API만 확인)
    evolution:                      # 진화 달성 보상(스케치 10원·완성작 50원). 트레이닝 보상과 다른 코드를 쓴다
      mode: ${EVOLUTION_PROMOTION_MODE:off}   # off(기본) / record / grant. 켜면 앱이 "스케치가 되면 10원"을 안내한다
      code: ${EVOLUTION_PROMOTION_CODE:}      # 테스트는 TEST_ 로 시작하는 코드(지급·차감 없이 API만 확인)
  admin:
    key: ${ADMIN_KEY:}                 # 비우면 관리자 API(/api/admin/**)가 아예 만들어지지 않는다
  dev-tools: false                 # 운영에서는 반드시 false
  iap:
    verify: toss                    # 토스 서버에 주문 결제 여부를 확인(mTLS 인증서 필요)
    keystore-path: ${IAP_KEYSTORE_PATH:}
    keystore-password: ${IAP_KEYSTORE_PASSWORD:}
    keystore-type: PKCS12

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

stability:
  api-key: ${STABILITY_API_KEY:}

image:
  prompt-version: ${IMAGE_PROMPT_VERSION:v3}  # v3(칸으로 나눈 프롬프트) | v2(이전 프롬프트, 롤백용)
  provider: ${IMAGE_PROVIDER:openai}

openai:
  api-key: ${OPENAI_API_KEY:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

point:
  ad-reward:
    amount: ${AD_REWARD_AMOUNT:100}            # 광고 한 번 보상(잉크)
    daily-limit: ${AD_REWARD_DAILY_LIMIT:5}    # 하루(KST) 받을 수 있는 횟수
    cooldown-seconds: ${AD_REWARD_COOLDOWN_SECONDS:300}  # 한 번 받은 뒤 다음 보상까지(초)
    min-watch-ms: ${AD_REWARD_MIN_WATCH_MS:0}  # 0이면 끔. 앱이 알려 준 시청 시간이 이보다 짧으면 지급하지 않는다
