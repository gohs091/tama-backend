spring:
  datasource:
    url: jdbc:mysql://${RDS_ENDPOINT}:3306/tamagotchi?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

tamagotchi:
  vitals:
    satiety-minutes-per-point: 6    # 포만감 1 감소에 걸리는 분 (6분 → 약 10시간에 100→0)
    strength-minutes-per-point: 12  # 파워 1 감소에 걸리는 분 (12분 → 약 20시간에 100→0)
    death-after-empty-hours: 4      # 포만감/파워가 0인 채 이 시간이 지나면 사망
    poop-interval-minutes: 60       # 똥이 1개 늘어나는 간격
    max-poop: 8                     # 이 개수 이상이면 사망
    max-tick-gap-minutes: 5         # 틱 간격이 이보다 길면 서버 중단으로 보고 그 시간은 반영하지 않음

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

stability:
  api-key: ${STABILITY_API_KEY:}

image:
  provider: ${IMAGE_PROVIDER:openai}

openai:
  api-key: ${OPENAI_API_KEY}
