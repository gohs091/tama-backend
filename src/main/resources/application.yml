spring:
  datasource:
    url: jdbc:mysql://localhost:3307/tamagotchi?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: tamagotchi
    password: tamagotchi1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

# 끄적이 알림(토스 스마트 발송). 콘솔 템플릿 검수가 끝나면 켠다 (PUSH_ENABLED=true)
push:
  enabled: ${PUSH_ENABLED:false}
  code-prefix: doodle-app-
  # 콘솔 템플릿에 {{petName}} 뒤 조사(가·의)를 이미 적어 둔 알림 코드 (쉼표로). 서버는 그 알림에 조사 없이 이름만 보낸다
  inline-particle: ${PUSH_INLINE_PARTICLE:hungry}

tamagotchi:
  vitals:
    satiety-minutes-per-point: 8    # 포만감 1 감소에 걸리는 분 (8분 → 약 13시간에 100→0)
    strength-minutes-per-point: 16  # 파워 1 감소에 걸리는 분 (16분 → 약 27시간에 100→0)
    death-after-empty-hours: 6      # 포만감/파워가 0인 채 이 시간이 지나면 사망
    poop-interval-minutes: 60       # 똥이 1개 늘어나는 간격
    max-poop: 13                    # 이 개수 이상이면 사망
    max-tick-gap-minutes: 5         # 틱 간격이 이보다 길면 서버 중단으로 보고 그 시간은 반영하지 않음
  auth:
    enabled: false                   # 로컬 개발은 로그인 없이 쓴다
    token-secret: ${AUTH_TOKEN_SECRET:}   # 비우면 서버가 켜질 때마다 임시 키를 만든다 (재시작 시 앱이 자동 재로그인)
    token-ttl-seconds: 43200        # 토큰 유효 시간(12시간)
  promotion:
    mode: record                    # off: 판정 안 함 / record: 대상 여부를 판정해 기록만 함 / grant: 기록하고 토스 포인트를 실제로 지급(code 필요)
    code: ${PROMOTION_CODE:}             # 콘솔에서 만든 프로모션 코드. 테스트는 앞에 TEST_ 가 붙은 코드(지급·차감 없이 API만 확인)
    evolution:                      # 진화 달성 보상(스케치 10원·완성작 50원). 트레이닝 보상과 다른 코드를 쓴다
      mode: record                  # off / record / grant
      code: ${EVOLUTION_PROMOTION_CODE:}
  admin:
    key: ${ADMIN_KEY:}                 # 비우면 관리자 API(/api/admin/**)가 아예 만들어지지 않는다
  dev-tools: true                 # 로컬 개발 전용 엔드포인트(/api/dev/*)
  iap:
    verify: skip                    # 로컬 개발 전용: 주문 검증을 건너뜀. 운영은 toss

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

image:
  prompt-version: ${IMAGE_PROMPT_VERSION:v3}  # v3(칸으로 나눈 프롬프트) | v2(이전 프롬프트, 롤백용)
  ink-style: ${IMAGE_INK_STYLE:v0}  # 잉크 진화 시안: v0(부위 교체, 지금) | v1(속성 재해석) | v2(v1+잉크 색·비율 유지·진영 색 제외) | v3(v2+모양 잉크는 몸 색 유지) | v4(v3+완성작은 얼굴까지 새로 디자인) | v5(낙서 측면·스케치 아기 체형·완성작 디자인 후보 3개) | v6(v5에서 스케치만: 한 줄 설명으로 새로 그림) — git 태그 ink-evo-vN
  v5-model: ${IMAGE_V5_MODEL:gpt-image-2.6-sunburst}  # v5 스케치·완성작 모델 (낙서 단계는 openai.image-model)
  v5-quality: ${IMAGE_V5_QUALITY:low}
  provider: ${IMAGE_PROVIDER:openai}  # openai | stability(롤백용)
  quota-enabled: true         # false면 생성 횟수 제한을 끈다 (로컬 개발 전용)
  daily-limit-per-user: 8     # 유저당 하루 이미지 생성 한도 (낙서+스케치+완성작 = 3회)
  daily-limit-global: 2000    # 서비스 전체 하루 한도 (비용 폭주 방지 최후 장치)

openai:
  api-key: ${OPENAI_API_KEY:}
  image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1-mini}
  image-quality: ${OPENAI_IMAGE_QUALITY:medium}  # low | medium | high

stability:
  api-key: ${STABILITY_API_KEY:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

point:
  ad-reward:
    amount: ${AD_REWARD_AMOUNT:200}            # 광고 한 번 보상(잉크)
    daily-limit: ${AD_REWARD_DAILY_LIMIT:10}    # 하루(KST) 받을 수 있는 횟수
    cooldown-seconds: ${AD_REWARD_COOLDOWN_SECONDS:300}  # 한 번 받은 뒤 다음 보상까지(초)
    min-watch-ms: ${AD_REWARD_MIN_WATCH_MS:0}  # 0이면 끔. 앱이 알려 준 시청 시간이 이보다 짧으면 지급하지 않는다

# 끄적이 그림 저장소. 켜면 그림을 DB(base64) 대신 S3에 올리고 DB에는 키만 남긴다. 권한은 EC2 역할(IAM Role)로 받는다 (키 파일 없음)
storage:
  s3:
    enabled: ${S3_ENABLED:false}
    bucket: ${S3_BUCKET:doodle-image}
    region: ${S3_REGION:ap-northeast-2}
    migrate: ${S3_MIGRATE_EXISTING:false}   # 켜면 서버가 뜰 때 DB에 남은 base64 그림을 S3로 옮기고 DB에서 지운다
  cdn-base: ${CDN_BASE_URL:https://d1k9cezbye963n.cloudfront.net}