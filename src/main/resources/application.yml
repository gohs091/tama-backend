spring:
  datasource:
    url: jdbc:mysql://localhost:3307/tamagotchi?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: tamagotchi
    password: tamagotchi1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

tamagotchi:
  vitals:
    satiety-minutes-per-point: 6    # 포만감 1 감소에 걸리는 분 (6분 → 약 10시간에 100→0)
    strength-minutes-per-point: 12  # 파워 1 감소에 걸리는 분 (12분 → 약 20시간에 100→0)
    death-after-empty-hours: 4      # 포만감/파워가 0인 채 이 시간이 지나면 사망
    poop-interval-minutes: 60       # 똥이 1개 늘어나는 간격
    max-poop: 8                     # 이 개수 이상이면 사망
    max-tick-gap-minutes: 5         # 틱 간격이 이보다 길면 서버 중단으로 보고 그 시간은 반영하지 않음

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

image:
  provider: ${IMAGE_PROVIDER:stability}  # stability | openai
  quota-enabled: true         # false면 생성 횟수 제한을 끈다 (로컬 개발 전용)
  daily-limit-per-user: 8     # 유저당 하루 이미지 생성 한도 (유체+성체+완전체 = 3회)
  daily-limit-global: 2000    # 서비스 전체 하루 한도 (비용 폭주 방지 최후 장치)

openai:
  api-key: ${OPENAI_API_KEY:}
  image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1-mini}
  image-quality: ${OPENAI_IMAGE_QUALITY:medium}  # low | medium | high

stability:
  api-key: ${STABILITY_API_KEY:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}